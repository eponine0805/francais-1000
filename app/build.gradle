plugins { id 'com.android.application' }

android {
    namespace 'com.francais.mille'
    compileSdk 35

    defaultConfig {
        applicationId 'com.francais.mille'
        minSdk 24
        targetSdk 28
        versionCode 5
        versionName '1.5.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
