name: Premium French audio - audition and build
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'samples first; full only after listening to samples'
        type: choice
        required: true
        default: samples
        options:
          - samples
          - full
      voice:
        description: 'Voice to use for the full batch; samples always compare three voices'
        type: choice
        required: true
        default: fr-FR-Chirp3-HD-Aoede
        options:
          - fr-FR-Chirp3-HD-Aoede
          - fr-FR-Chirp3-HD-Leda
          - fr-FR-Chirp3-HD-Kore
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_TTS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_TTS_SERVICE_ACCOUNT_JSON }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      FRENCH_TTS_VOICE: ${{ inputs.voice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: inputs.mode == 'full'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: inputs.mode == 'full'
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.mode == 'full'
        with:
          gradle-version: '8.9'
      - name: Require Google Cloud secret
        shell: bash
        run: |
          if [[ -z "$GOOGLE_TTS_SERVICE_ACCOUNT_JSON" && -z "$GOOGLE_TTS_API_KEY" ]]; then
            echo 'Missing GOOGLE_TTS_API_KEY or GOOGLE_TTS_SERVICE_ACCOUNT_JSON GitHub Actions secret.'
            echo 'Do not put keys in source code. See README for setup.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio utilities and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python3 -m pip install 'google-auth>=2.35,<3' 'requests>=2.32,<3'
      - name: Generate French HD female audio
        run: python3 scripts/generate_audio_chirp.py --mode "${{ inputs.mode }}"
      - name: Upload preview sounds (listen before full batch)
        if: inputs.mode == 'samples'
        uses: actions/upload-artifact@v4
        with:
          name: fr-FR-Chirp3-HD-preview
          path: premium-audio-samples/*.ogg
      - name: Install Android build platform
        if: inputs.mode == 'full'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate premium bundle
        if: inputs.mode == 'full'
        run: |
          python3 scripts/prepare_vocabulary.py
          python3 scripts/validate.py
      - name: Build completely offline-capable APK with HD voice
        if: inputs.mode == 'full'
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload premium APK
        if: inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: Francais1000-PremiumVoice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish premium APK
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Francais1000.apk
          if gh release view v1.4.1 >/dev/null 2>&1; then
            gh release upload v1.4.1 Francais1000.apk --clobber
          else
            gh release create v1.4.1 Francais1000.apk --target "$GITHUB_SHA" --title 'Français 1000 v1.4.1 — HD female French voice' --notes 'High-definition fr-FR Chirp 3 female sound files bundled entirely offline. Generated via authorized Google Cloud TTS account.'
          fi
