name: Build Android APK (Supertonic 3)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install speech generator for offline build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install -r scripts/requirements-audio.txt
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate 1000 French female audio clips
        run: |
          python scripts/prepare_vocabulary.py
          python scripts/generate_audio.py
          python scripts/validate.py
      - name: Save pronunciation QA samples
        uses: actions/upload-artifact@v4
        with:
          name: French-Female-Audio-QA
          path: quality-previews/
          retention-days: 90
      - name: Build offline APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Francais1000-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Francais1000.apk
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 Francais1000.apk --clobber
          else
            gh release create v1.5.0 Francais1000.apk --target "$GITHUB_SHA" --title 'Français 1000 v1.5.0 — Supertonic 3' --notes 'New French female Supertonic 3 F2 neural voice; 1000 bundled offline clips. No API keys or accounts. Model OpenRAIL-M; speech is AI-generated. Native-speaker review recommended for sale.'
          fi
