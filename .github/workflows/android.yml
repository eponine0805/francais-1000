name: Build Android APK (Supertonic 3)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reuse the approved 1000 offline Supertonic 3 recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fr1000-voice app/src/main/assets/audio
          gh release download v1.5.0 --repo "${{ github.repository }}" --pattern Francais1000.apk --dir /tmp/fr1000-voice
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path('/tmp/fr1000-voice/Francais1000.apk')
          with zipfile.ZipFile(apk) as archive:
              names = [name for name in archive.namelist() if name.startswith('assets/audio/') and name.endswith('.ogg')]
              assert len(names) == 1000, f'Expected 1000 source audio files, got {len(names)}'
              out = Path('app/src/main/assets/audio')
              for name in names:
                  (out / Path(name).name).write_bytes(archive.read(name))
          PY
          python3 scripts/prepare_vocabulary.py
          python3 scripts/validate.py
      - name: Build offline APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Francais1000-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Francais1000.apk
          if gh release view v1.6.1 >/dev/null 2>&1; then
            echo "ERROR: v1.6.1 is already published. Bump the version instead of overwriting it." >&2
            exit 1
          else
            gh release create v1.6.1 Francais1000.apk --target "$GITHUB_SHA" --title 'Français 1000 v1.6.1 — Integrity fixes' --notes 'Audit: corrected legacy-progress migration, review resolution, meaning-aware distractors, quiz/card session restore, and accurate retry labels. Existing learning flow and offline audio preserved.'
          fi
