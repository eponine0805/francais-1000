name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install neural speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends espeak-ng ffmpeg
          python -m pip install -r scripts/requirements-audio.txt
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download Kokoro offline build models
        run: |
          mkdir -p models
          curl -fLsS --retry 4 --retry-delay 5 -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fLsS --retry 4 --retry-delay 5 -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s models/kokoro-v1.0.onnx)" -gt 100000000
          test "$(stat -c%s models/voices-v1.0.bin)" -gt 100000
      - name: Prepare offline French female audio
        run: |
          python scripts/prepare_vocabulary.py
          python scripts/generate_audio.py
          python scripts/validate.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Francais1000-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Francais1000.apk
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 Francais1000.apk --clobber
          else
            gh release create v1.3.0 Francais1000.apk --target "$GITHUB_SHA" --title 'Français 1000 v1.3.0' --notes 'IPA for all 1000 entries, refined monochrome interface, searchable dictionary, favorites, learning streaks and a correction to the Je suis sound. All lessons and audio offline.'
          fi
