name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends espeak ffmpeg
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare offline audio
        run: |
          python3 scripts/prepare_vocabulary.py
          python3 scripts/generate_audio.py
          python3 scripts/validate.py
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Francais1000-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Francais1000.apk
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 Francais1000.apk --clobber
          else
            gh release create v1.1.0 Francais1000.apk --target "$GITHUB_SHA" --title 'Français 1000 v1.1.0' --notes '1000 French words, 1000 offline pronunciations, four-choice tests and on-device progress.'
          fi
